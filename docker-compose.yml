services:
  backend:
    image: 723346695849.dkr.ecr.ap-northeast-1.amazonaws.com/home_manager/repository/django-backend
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfiles/backend/Dockerfile
    container_name: django-backend
    command: >
      gunicorn
      --chdir mysite
      mysite.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 2
    expose:
      - "8000"

  nginx:
    image: 723346695849.dkr.ecr.ap-northeast-1.amazonaws.com/home_manager/repository/nginx-frontend
    build:
      context: .
      dockerfile: Dockerfiles/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
