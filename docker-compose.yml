services:
  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfiles/backend/Dockerfile
    container_name: django-backend
    command: >
      gunicorn
      --chdir mysite
      mysite.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 2
    expose:
      - "8000"
    volumes:
      - static_volume:/app/mysite/staticfiles

  nginx:
    build:
      context: .
      dockerfile: Dockerfiles/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - static_volume:/usr/share/nginx/static

volumes:
  static_volume:
